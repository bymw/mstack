<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habit tracker: Today</title>
<style>
  body { margin: 0; width: 390px; font-family: -apple-system, system-ui, sans-serif; background: #fff; color: #222; }
  .header { padding: 18px 20px; background: linear-gradient(135deg, #7b5cff, #ff5ca8); box-shadow: 0 0 24px rgba(123, 92, 255, 0.6); color: #fff; }
  .header h1 { font-size: 28px; font-weight: 800; margin: 0 0 6px; }
  .header p { font-size: 13px; font-weight: 500; margin: 0; }
  .actions { display: flex; gap: 10px; padding: 13px 8px; }
  .btn { flex: 1; padding: 13px; border: 0; border-radius: 10px; background: #7b5cff; color: #fff; font-size: 17px; font-weight: 700; }
  .streak { padding: 0 20px; font-size: 15px; color: #444; }
  .list { padding: 12px 16px; }
  .card { background: rgba(0, 0, 0, 0.02); border: 1px solid #ddd; border-radius: 12px; padding: 8px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,.12), 0 8px 20px rgba(0,0,0,.08); }
  .inner { border: 1px solid #e4e4e4; border-radius: 12px; padding: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .name { font-size: 19px; font-weight: 600; margin: 0; }
  .meta { font-size: 11px; color: #b8b8b8; margin: 4px 0 0; }
  .note { font-size: 14px; color: #b8b8b8; margin: 6px 0 0; }
  .tag { display: inline-block; font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: #ffe7f3; color: #ff5ca8; border: 1px solid #ffbfdc; }
  .footer { padding: 18px 20px; font-size: 22px; font-weight: 700; }
</style>
</head>
<body>
  <div class="header">
    <h1>Today</h1>
    <p>Tuesday, 3 habits left</p>
  </div>

  <div class="actions">
    <button class="btn">Log habit</button>
    <button class="btn">Go Premium</button>
  </div>

  <p class="streak">Streak goal: 18 of 30 days</p>

  <div class="list">
    <div class="card"><div class="inner">
      <p class="name">Drink water</p>
      <p class="meta">6 of 8 glasses</p>
      <p class="note">Last logged 40 min ago</p>
      <span class="tag">On track</span>
    </div></div>
    <div class="card"><div class="inner">
      <p class="name">Read 20 pages</p>
      <p class="meta">0 of 20 pages</p>
      <p class="note">Usually done by 21:00</p>
      <span class="tag">Due</span>
    </div></div>
    <div class="card"><div class="inner">
      <p class="name">Stretch</p>
      <p class="meta">Done</p>
      <p class="note">Logged at 07:12</p>
      <span class="tag">Done</span>
    </div></div>
  </div>

  <div class="footer">Weekly summary</div>
</body>
</html>
